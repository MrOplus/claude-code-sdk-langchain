[workspace]
name = "claude-code-sdk-langchain"
description = "LangChain chat model backed by the Claude Agent SDK (Claude Code CLI)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.11.*"
# Core LangChain stack
langchain-core = ">=1.0"
langchain = ">=1.0"
pydantic = ">=2.0"
# Development essentials
pytest = "*"
pytest-asyncio = ">=0.23"
black = "*"
ruff = "*"
mypy = "*"
# Packaging
python-build = "*"
twine = "*"

[pypi-dependencies]
claude-agent-sdk = ">=0.2.0"
claude-code-langchain = { path = ".", editable = true }

[tasks]
# Tests
test = "pytest specs/ -v"
test-offline = "pytest specs/ -v -m 'not live'"
test-live = "pytest specs/ -v -m live"
smoke = "python scripts/smoke_test.py"
examples = "python examples/basic_usage.py"

# Code quality
lint = "ruff check src/ specs/ scripts/ examples/"
format = "black src/ specs/ scripts/ examples/"
format-check = "black --check src/ specs/ scripts/ examples/"
typecheck = "mypy src/"
check = { depends-on = ["format-check", "lint", "typecheck"] }

# Cleanup
clean = "python -c \"import pathlib, shutil; [shutil.rmtree(p) for p in pathlib.Path('.').rglob('__pycache__') if '.pixi' not in p.parts]\""
clean-build = "python -c \"import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ('dist', 'build', 'src/claude_code_langchain.egg-info')]\""

# Build and packaging (GitHub distribution)
build-package = { cmd = "python -m build", depends-on = ["clean-build"] }
validate-package = { cmd = "twine check dist/*", depends-on = ["build-package"] }

# Deployment workflow
deploy = "python scripts/deploy.py --skip-tests"
deploy-with-tests = "python scripts/deploy.py"
deploy-tag = "python scripts/deploy.py --skip-tests --tag"

[activation.env]
# Model for live tests - haiku for speed, sonnet/opus for quality
CLAUDE_TEST_MODEL = "haiku"
